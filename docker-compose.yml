
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pk_user
      POSTGRES_PASSWORD: pk_password
      POSTGRES_DB: pk_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pk_user", "-d", "pk_user"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  auth:
    build: ./services/auth
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: auth_schema
      JWT_SECRET: dev_secret_key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy

  form:
    build: ./services/form
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: form_schema
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workflow:
    build: ./services/workflow
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: workflow_schema
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

  task:
    build: ./services/task
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: task_schema
      WORKFLOW_SERVICE_URL: http://workflow:8003
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      workflow:
        condition: service_started

  notification:
    build: ./services/notification
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: notification_schema
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth
      - form
      - workflow
      - task
      - notification

volumes:
  postgres_data:
  uploads:
