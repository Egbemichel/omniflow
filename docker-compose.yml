
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pk_user
      POSTGRES_PASSWORD: pk_password
      POSTGRES_DB: pk_user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pk_user", "-d", "pk_user"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  auth:
    build: ./services/auth
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: auth_schema
      JWT_SECRET: dev_secret_key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
      FRONTEND_URL: http://localhost
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAGIC_LINK_FROM_EMAIL: ${MAGIC_LINK_FROM_EMAIL}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-egbemichel39@gmail.com}
      BOOTSTRAP_SUPER_ADMIN_NAME: ${BOOTSTRAP_SUPER_ADMIN_NAME:-Egbemicheal}
      BOOTSTRAP_INSTITUTION_NAME: ${BOOTSTRAP_INSTITUTION_NAME:-Omniflow}
    depends_on:
      postgres:
        condition: service_healthy

  form:
    build: ./services/form
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: form_schema
      AUTH_SERVICE_URL: http://auth:8001
      TASK_SERVICE_URL: http://task:8004
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  workflow:
    build: ./services/workflow
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: workflow_schema
      AUTH_SERVICE_URL: http://auth:8001
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  task:
    build: ./services/task
    ports:
      - "8004:8004"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: task_schema
      WORKFLOW_SERVICE_URL: http://workflow:8003
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      workflow:
        condition: service_started

  notification:
    build: ./services/notification
    ports:
      - "8005:8005"
    environment:
      DATABASE_URL: postgresql://pk_user:pk_password@postgres:5432/pk_user
      DATABASE_SCHEMA: notification_schema
      AUTH_SERVICE_URL: http://auth:8001
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  frontend:
    build: ./frontend
    expose:
      - "80"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
    volumes:
    - ./frontend:/usr/share/nginx/html

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - form
      - workflow
      - task
      - notification
      - frontend

volumes:
  postgres_data:
  uploads:
