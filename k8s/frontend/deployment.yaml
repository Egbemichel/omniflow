apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: omniflow

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 127.0.0.1:5001/omniflow-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          env:
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: omniflow-secret
                  key: GOOGLE_CLIENT_ID

            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: omniflow-secret
                  key: GOOGLE_REDIRECT_URI

            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: omniflow-secret
                  key: GITHUB_CLIENT_ID

            - name: GITHUB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: omniflow-secret
                  key: GITHUB_REDIRECT_URI

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"