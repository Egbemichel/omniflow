apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omniflow-prometheus

rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch

  - nonResourceURLs:
      - /metrics
    verbs:
      - get
