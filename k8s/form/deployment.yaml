apiVersion: apps/v1
kind: Deployment
metadata:
  name: form
  namespace: omniflow

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: form

  template:
    metadata:
      labels:
        app: form

    spec:
      containers:
        - name: form

          image: 127.0.0.1:5001/omniflow-form:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8002

          env:

            - name: DATABASE_URL
              value: "postgresql://pk_user:pk_password@10.43.180.200:5432/pk_user"

            - name: DATABASE_SCHEMA
              value: form_schema

            - name: REDIS_URL
              value: "redis://10.43.106.207:6379/0"

            - name: AUTH_SERVICE_URL
              value: "http://10.43.38.73:8001"

            - name: TASK_SERVICE_URL
              value: "http://10.43.43.252:8004"

            - name: UPLOAD_DIR
              value: "/uploads"

            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omniflow-secret
                  key: GEMINI_API_KEY

            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"

          volumeMounts:
            - name: uploads
              mountPath: /uploads

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: form-uploads-pvc