name: CI Pipeline

on:
  push:
    branches: ["**"]          # every branch, every push
  pull_request:
    branches: [main, develop]  # full test suite on PRs to these branches

jobs:

  # ─── JOB 1: LINT ALL SERVICES ────────────────────────────────────
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff bandit pip-audit

      - name: Run ruff linter
        run: ruff check services/

      - name: Run ruff formatter check
        run: ruff format --check services/

      - name: Run bandit security scanner
        run: bandit -r services/ -ll --exclude services/auth/tests,services/form/tests,services/workflow/tests,services/task/tests,services/notification/tests

      - name: Run pip-audit (CVE check) on each service
        run: |
          for svc in auth form workflow task notification; do
            echo "Auditing $svc..."
            cd services/$svc
            pip-audit --ignore-vuln CVE-2026-30922 --ignore-vuln CVE-2025-62727 --ignore-vuln CVE-2024-47874 --ignore-vuln CVE-2025-54121
            cd ../..
          done

  # ─── JOB 2: UNIT + INTEGRATION TESTS ────────────────────────────
  test:
    name: Tests (Unit + Integration)
    runs-on: ubuntu-latest
    needs: lint    # only runs if lint passes

    services:
      # Real PostgreSQL for integration tests
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pk_user
          POSTGRES_PASSWORD: pk_password
          POSTGRES_DB: paper_killer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Real Redis for event tests
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pk_user:pk_password@localhost:5432/paper_killer_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test_secret_key_not_for_production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      AUTH_SERVICE_URL: http://localhost:8001
      WORKFLOW_SERVICE_URL: http://localhost:8003

    strategy:
      matrix:
        service: [auth, form, workflow, task, notification]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies for ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx

      - name: Run migrations for ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          alembic upgrade head
        env:
          DATABASE_SCHEMA: ${{ matrix.service }}_schema

      - name: Run tests with coverage for ${{ matrix.service }}
        run: |
          cd services/${{ matrix.service }}
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85
        env:
          DATABASE_SCHEMA: ${{ matrix.service }}_schema

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml

  # ─── JOB 3: DOCKER BUILD VALIDATION ─────────────────────────────
  docker-build:
    name: Validate Docker Builds
    runs-on: ubuntu-latest
    needs: test    # only builds if all tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all service images
        run: |
          docker build -t pk-auth:test        ./services/auth
          docker build -t pk-form:test        ./services/form
          docker build -t pk-workflow:test    ./services/workflow
          docker build -t pk-task:test        ./services/task
          docker build -t pk-notification:test ./services/notification
          docker build -t pk-frontend:test    ./frontend

      - name: Verify all images exist
        run: docker images | grep pk-

  # ─── JOB 4: COVERAGE SUMMARY COMMENT ON PR ───────────────────────
  coverage-comment:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}