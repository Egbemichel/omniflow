<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — OmniFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script src="js/tailwind-config.js"></script>
  <script src="/config.js"></script>
</head>
<body class="bg-apple-base min-h-screen flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-md p-10 rounded-apple-lg border-hairline shadow-sm">
    <div class="text-center mb-8">
      <h1 class="t-headline mb-2">Sign in to OmniFlow</h1>
      <p class="t-body text-slate-500">Choose your preferred method</p>
    </div>

    <div class="space-y-4">
      <button id="btn-google" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-300 py-3 rounded-apple-pill t-button hover:bg-slate-50 transition-colors">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google Logo">
        Continue with Google
      </button>

      <button id="btn-github" class="w-full flex items-center justify-center gap-3 border bg-white text-dark py-3 rounded-apple-pill t-button hover:opacity-90 transition-opacity">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path></svg>
        Continue with GitHub
      </button>

      <div class="flex items-center gap-4 my-6">
        <div class="h-px bg-slate-200 flex-grow"></div>
        <span class="t-caption text-slate-400">OR</span>
        <div class="h-px bg-slate-200 flex-grow"></div>
      </div>

      <form class="space-y-4">
        <div>
          <label class="block t-caption-strong text-slate-600 mb-1 ml-1" for="email">Institutional Email</label>
          <input type="email" id="email" placeholder="name@university.edu"
            class="w-full px-4 py-3 border border-slate-200 rounded-sm focus:outline-none focus:ring-2 focus:ring-apple-accent focus:border-transparent t-body">
        </div>
        <button type="submit" class="w-full bg-apple-accent text-black py-3 rounded-apple-pill t-button hover:bg-blue-700 hover:text-white transition-colors shadow-sm">
          Send Magic Link
        </button>
      </form>
    </div>

    <p class="t-fine text-center text-slate-400 mt-8">
      By continuing, you agree to our <a href="#" class="underline">Terms of Service</a> and <a href="#" class="underline">Privacy Policy</a>.
    </p>
  </div>
  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
