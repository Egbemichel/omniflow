<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — OmniFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/tailwind-config.js"></script>
  <script src="/config.js"></script>
</head>
<body style="background-color:var(--bg-base);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem">
  <div class="pk-card w-full" style="max-width:448px">
    <div class="text-center mb-8">
      <h1 class="t-headline mb-2" style="color:var(--text-primary)">Sign in to OmniFlow</h1>
      <p class="t-body" style="color:var(--text-muted)">Choose your preferred method</p>
    </div>

    <div class="space-y-4">
      <button id="btn-google" class="pk-btn-secondary w-full gap-3">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="Google Logo">
        Continue with Google
      </button>

      <button id="btn-github" class="pk-btn-secondary w-full gap-3">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Continue with GitHub
      </button>

      <div class="flex items-center gap-4 my-6">
        <div class="flex-grow" style="height:1px;background-color:var(--border-default)"></div>
        <span class="t-caption" style="color:var(--text-muted)">OR</span>
        <div class="flex-grow" style="height:1px;background-color:var(--border-default)"></div>
      </div>

      <form id="magic-link-form" class="space-y-4">
        <div>
          <label class="block t-caption-strong mb-1 ml-1" style="color:var(--text-muted)" for="email">Institutional Email</label>
          <input type="email" id="email" placeholder="name@university.edu" class="pk-input">
        </div>
        <button type="submit" class="pk-btn-primary w-full">Send Magic Link</button>
      </form>
    </div>

    <p class="t-fine text-center mt-8" style="color:var(--text-muted)">
      By continuing, you agree to our <a href="#" style="color:var(--text-muted);text-decoration:underline">Terms of Service</a> and <a href="#" style="color:var(--text-muted);text-decoration:underline">Privacy Policy</a>.
    </p>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
