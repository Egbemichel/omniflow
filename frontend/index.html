<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniFlow — Workflow Digitization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/tailwind-config.js"></script>
</head>
<body style="background-color:var(--bg-base);min-height:100vh;display:flex;flex-direction:column">
  <header style="height:52px;background-color:var(--bg-surface-dark);display:flex;align-items:center;padding:0 1.5rem;justify-content:space-between;position:sticky;top:0;z-index:10">
    <div class="t-nav" style="color:var(--text-on-dark);font-weight:600">OmniFlow</div>
    <nav style="display:flex;gap:1.5rem">
      <a href="#" class="t-nav" style="color:var(--text-on-dark);opacity:0.8;text-decoration:none" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">Product</a>
      <a href="#" class="t-nav" style="color:var(--text-on-dark);opacity:0.8;text-decoration:none" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">Features</a>
      <a href="login.html" class="t-nav" style="color:var(--text-on-dark);opacity:0.8;text-decoration:none" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8">Sign In</a>
    </nav>
  </header>

  <main style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;text-align:center">
    <h1 class="t-display mb-4" style="color:var(--text-primary)">Digitize your workflow<br><span style="color:var(--accent-primary)">in minutes.</span></h1>
    <p class="t-body-lg mb-8" style="color:var(--text-muted);max-width:44rem">
      OmniFlow helps institutions move from physical forms and manual handoffs to a structured, automated digital flow.
    </p>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
      <a href="login.html" class="pk-btn-primary" style="text-decoration:none;padding:0.75rem 2rem">Get Started</a>
      <a href="#" class="pk-btn-secondary" style="text-decoration:none;padding:0.75rem 2rem">Documentation</a>
    </div>
  </main>

  <footer style="padding:2rem;border-top:1px solid var(--border-default);text-align:center">
    <p class="t-fine" style="color:var(--text-muted)">&copy; 2026 OmniFlow. All rights reserved.</p>
  </footer>
</body>
</html>
