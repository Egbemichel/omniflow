server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # QR code landing: /submit/<form_id> → end_user.html
    # JS extracts form_id from window.location.pathname
    location /submit/ {
        try_files $uri /end_user.html;
    }
}
