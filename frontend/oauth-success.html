<!DOCTYPE html>
<html>
<head><title>Signing you in...</title></head>
<body>
<script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const token = params.get("token");
    if (token) {
        sessionStorage.setItem("of_token", token);
        let role = '';
        try {
            const b64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            role = JSON.parse(atob(b64)).role || '';
        } catch {}
        if (role === 'admin' || role === 'super_admin') window.location.href = '/admin.html';
        else if (role === 'staff') window.location.href = '/staff.html';
        else window.location.href = '/dashboard.html';
    } else {
        window.location.href = "/login.html?error=oauth_failed";
    }
</script>
</body>
</html>
