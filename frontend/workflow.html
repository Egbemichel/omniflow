<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workflows — OmniFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/tailwind-config.js"></script>
</head>
<body style="background-color:var(--bg-base);display:flex;height:100vh;overflow:hidden">

  <!-- Sidebar -->
  <aside class="pk-sidebar">
    <div class="px-2 mb-10">
      <h2 class="t-nav" style="color:var(--text-on-dark);font-weight:600">OMNIFLOW</h2>
    </div>
    <nav class="flex-grow space-y-1">
      <a href="dashboard.html" class="pk-nav-item">Dashboard</a>
      <a id="nav-workflows" href="workflow.html" class="pk-nav-item active">Workflows</a>
      <a id="nav-admin" href="admin.html" class="pk-nav-item">Admin</a>
    </nav>
    <div class="mt-auto space-y-1" style="border-top:1px solid var(--border-default);padding-top:1rem">
      <button onclick="signOut()" class="pk-nav-item">Sign Out</button>
    </div>
  </aside>

  <main class="pk-content">
    <div class="pk-content-inner">
      <header class="mb-12 flex justify-between items-center gap-4 flex-wrap">
        <div>
          <h1 class="t-headline" style="color:var(--text-primary)">Workflows</h1>
          <p class="t-body" style="color:var(--text-muted)">Signed in as <span id="user-name">User</span> · Define and manage institutional business processes.</p>
        </div>
        <button id="create-wf-btn" class="pk-btn-primary">Create Workflow</button>
      </header>

      <div id="workflow-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- skeleton -->
        <div class="pk-card" style="animation:pulse 1.5s ease-in-out infinite">
          <div style="height:16px;background-color:var(--bg-base);border-radius:8px;width:75%;margin-bottom:1rem"></div>
          <div style="height:12px;background-color:var(--bg-base);border-radius:8px;width:50%"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Builder Modal -->
  <div id="builder-modal" class="pk-modal-backdrop hidden">
    <div class="pk-modal w-full" style="max-width:672px">
      <header class="flex justify-between items-center mb-8">
        <h2 class="t-title" style="color:var(--text-primary)">Workflow Builder</h2>
        <button id="close-builder-btn" class="pk-btn-ghost" style="padding:0.5rem">
          <i data-lucide="x" style="width:24px;height:24px"></i>
        </button>
      </header>

      <form id="builder-form" class="space-y-6">
        <div class="grid grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="t-caption-strong uppercase" style="color:var(--text-muted)">Workflow Name</label>
            <input type="text" id="wf-name" required class="pk-input" placeholder="e.g., Travel Request">
          </div>
          <div class="space-y-2">
            <label class="t-caption-strong uppercase" style="color:var(--text-muted)">Description</label>
            <input type="text" id="wf-desc" class="pk-input" placeholder="Brief purpose…">
          </div>
        </div>

        <div style="border-top:1px solid var(--border-default);padding-top:1.5rem">
          <div class="flex justify-between items-center mb-4">
            <h3 class="t-body" style="color:var(--text-primary);font-weight:600">Sequence Steps</h3>
            <button type="button" id="add-step-btn" class="pk-btn-link">+ Add Step</button>
          </div>
          <div id="steps-container" class="space-y-4"></div>
        </div>

        <div class="flex justify-end gap-4 pt-6">
          <button type="button" id="cancel-builder-btn" class="pk-btn-ghost">Cancel</button>
          <button type="submit" class="pk-btn-primary">Save Definition</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/workflow.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => lucide.createIcons());</script>
  <script>
    function signOut() {
      sessionStorage.removeItem('of_token');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
