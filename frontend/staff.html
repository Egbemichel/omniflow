<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal — OmniFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/tailwind-config.js"></script>
  <style>
    .section-content { display: none; }
    .section-content.active { display: block; }
  </style>
</head>
<body style="background-color:var(--bg-base);display:flex;height:100vh;overflow:hidden">

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside class="pk-sidebar">
    <div style="padding:0 0.5rem;margin-bottom:2.5rem">
      <p class="t-nav" style="color:var(--text-on-dark);font-weight:600">OMNIFLOW</p>
      <p id="sidebar-user" class="t-fine" style="color:var(--text-muted-dark);margin-top:0.25rem">Staff</p>
    </div>

    <nav class="flex-grow space-y-1">
      <button data-section="tasks" class="pk-nav-item w-full">
        <i data-lucide="check-square" style="width:16px;height:16px;flex-shrink:0"></i>
        My Tasks
        <span id="task-badge" class="pk-badge pk-badge-error" style="margin-left:auto;display:none">0</span>
      </button>
      <button data-section="account" class="pk-nav-item w-full">
        <i data-lucide="user" style="width:16px;height:16px;flex-shrink:0"></i> Account
      </button>
    </nav>

    <div style="margin-top:auto;border-top:1px solid var(--border-default);padding-top:1rem">
      <button onclick="signOut()" class="pk-nav-item w-full">
        <i data-lucide="log-out" style="width:16px;height:16px;flex-shrink:0"></i> Sign Out
      </button>
    </div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────── -->
  <main class="pk-content">
    <div class="pk-content-inner">

      <!-- ═══ TASKS ════════════════════════════════════════════ -->
      <section id="section-tasks" class="section-content">
        <header class="mb-10 flex justify-between items-end gap-4 flex-wrap">
          <div>
            <h1 class="t-headline" style="color:var(--text-primary)">My Tasks</h1>
            <p class="t-body mt-1" style="color:var(--text-muted)">
              <span id="task-count">0</span> pending task<span id="task-plural">s</span> assigned to you
            </p>
          </div>
          <button onclick="loadTasks()" class="pk-btn-secondary">Refresh</button>
        </header>

        <section class="pk-card">
          <div id="task-list" class="space-y-4">
            <p class="pk-empty">Loading tasks…</p>
          </div>
        </section>

        <section id="detail-panel" class="pk-card hidden mt-8">
          <div class="flex justify-between items-center mb-6">
            <h2 class="t-title" style="color:var(--text-primary)">Submission Detail</h2>
            <button onclick="closeDetail()" class="pk-btn-ghost" style="padding:0.25rem">
              <i data-lucide="x" style="width:20px;height:20px"></i>
            </button>
          </div>
          <dl id="detail-fields" class="space-y-4"></dl>
        </section>
      </section>

      <!-- ═══ ACCOUNT ══════════════════════════════════════════ -->
      <section id="section-account" class="section-content">
        <header class="mb-8">
          <h1 class="t-headline" style="color:var(--text-primary)">Account</h1>
        </header>
        <div class="pk-card" style="max-width:480px">
          <dl class="space-y-5">
            <div>
              <dt class="t-caption-strong uppercase" style="color:var(--text-muted);margin-bottom:0.25rem">Email</dt>
              <dd id="acct-email" class="t-body" style="color:var(--text-primary)">—</dd>
            </div>
            <div>
              <dt class="t-caption-strong uppercase" style="color:var(--text-muted);margin-bottom:0.25rem">Name</dt>
              <dd id="acct-name" class="t-body" style="color:var(--text-primary)">—</dd>
            </div>
            <div>
              <dt class="t-caption-strong uppercase" style="color:var(--text-muted);margin-bottom:0.25rem">System Role</dt>
              <dd><span class="pk-badge pk-badge-neutral" id="acct-role">—</span></dd>
            </div>
            <div>
              <dt class="t-caption-strong uppercase" style="color:var(--text-muted);margin-bottom:0.25rem">Actor Type</dt>
              <dd><span class="pk-badge pk-badge-warning" id="acct-actor-type">—</span></dd>
            </div>
          </dl>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="js/staff.js"></script>
  <script>
    function signOut() { sessionStorage.removeItem('of_token'); window.location.href = 'login.html'; }
    function closeDetail() { document.getElementById('detail-panel').classList.add('hidden'); }
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
</body>
</html>
