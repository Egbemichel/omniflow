worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Log format for easier debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Docker's embedded DNS. Resolving upstream hostnames at request time
    # (via variables in proxy_pass below) means a backend container can be
    # recreated with a new IP and the gateway self-heals within `valid` —
    # no gateway restart needed. ipv6=off avoids dead AAAA lookups.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Service hostnames are kept in variables so proxy_pass uses the resolver
    # at runtime instead of caching an IP at startup (the old `upstream {}`
    # blocks resolved once at boot and went stale on container recreate).

    server {
        listen 80;
        server_name localhost;

        # QR code landing — serve end_user.html; frontend nginx rewrites /submit/* → end_user.html
        location /submit/ {
            set $frontend_service "frontend:80";
            proxy_pass http://$frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Live updates (Server-Sent Events). No auth_request — EventSource can't
        # send headers, so the JWT rides in the ?token= query and the Notification
        # Service validates it. Buffering MUST be off so events flush immediately.
        location /api/events {
            set $notification_service "notification:8005";
            rewrite ^/api/events$ /events break;
            proxy_pass http://$notification_service;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # Public form API — no auth_request (end users filling forms via QR code)
        location /api/form-public/ {
            set $form_service "form:8002";
            rewrite ^/api/form-public/(.*)$ /$1 break;
            proxy_pass http://$form_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Serve Frontend
        location / {
            set $frontend_service "frontend:80";
            proxy_pass http://$frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth Service (Public & Internal usage)
        location /api/auth/ {
            set $auth_service "auth:8001";
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Internal Auth Verification for auth_request
        location = /_auth_verify {
            internal;
            set $auth_service "auth:8001";
            proxy_pass http://$auth_service/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Protected Services
        location /api/task/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;
            auth_request_set $actor_type $upstream_http_x_actor_type;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;
            proxy_set_header X-Actor-Type $actor_type;

            set $task_service "task:8004";
            rewrite ^/api/task/(.*)$ /$1 break;
            proxy_pass http://$task_service;
        }

        location /api/form/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;

            set $form_service "form:8002";
            rewrite ^/api/form/(.*)$ /$1 break;
            proxy_pass http://$form_service;
        }

        location /api/workflow/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;

            set $workflow_service "workflow:8003";
            rewrite ^/api/workflow/(.*)$ /$1 break;
            proxy_pass http://$workflow_service;
        }

        location /api/notification/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;
            auth_request_set $actor_type $upstream_http_x_actor_type;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;
            proxy_set_header X-Actor-Type $actor_type;

            set $notification_service "notification:8005";
            rewrite ^/api/notification/(.*)$ /$1 break;
            proxy_pass http://$notification_service;
        }

        # OAuth callbacks and other /auth/ paths (prefix preserved)
        location /auth/ {
            set $auth_service "auth:8001";
            proxy_pass http://$auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
