worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Log format for easier debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    upstream auth_service { server auth:8001; }
    upstream form_service { server form:8002; }
    upstream workflow_service { server workflow:8003; }
    upstream task_service { server task:8004; }
    upstream notification_service { server notification:8005; }
    upstream frontend_service { server frontend:80; }

    server {
        listen 80;
        server_name localhost;

        # Serve Frontend
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth Service (Public & Internal usage)
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Internal Auth Verification for auth_request
        location = /_auth_verify {
            internal;
            proxy_pass http://auth_service/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # Protected Services
        location /api/task/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;

            proxy_pass http://task_service/;
        }

        location /api/form/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;

            proxy_pass http://form_service/;
        }

        location /api/workflow/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;

            proxy_pass http://workflow_service/;
        }

        location /api/notification/ {
            auth_request /_auth_verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;
            auth_request_set $institution_id $upstream_http_x_institution_id;

            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Role $user_role;
            proxy_set_header X-Institution-Id $institution_id;

            proxy_pass http://notification_service/;
        }

        # Add this block alongside your other location blocks
        location /auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
